spring.application.name=secure-cloud-storage
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/secure_cloud_storage?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${S3_BUCKET:}
